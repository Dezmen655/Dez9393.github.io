<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Portfolio | Dezmen Acosta Photography</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Navigation -->
    <header>
        <nav>
            <div class="logo">DEZMEN ACOSTA</div>
            <ul>
                <li><a href="#gallery">Work</a></li>

    </header>

    <main>
        <!-- Gallery Grid Foundation -->
        <section id="gallery" class="gallery-container">
            <h2>Selected Work</h2>
            <div class="grid">
                <!-- Landscape Shots -->
                <div class="photo-box"><img src="images/IMG_1459.jpg" alt="Quinceañera Portrait Church Landscape"></div>
                <div class="photo-box"><img src="images/IMG_1480.jpg" alt="San Francisco Skyline and Bay Bridge at Night"></div>
                <div class="photo-box"><img src="images/IMG_3264.JPG" alt="Low Angle City Buildings Blue Sky"></div>
                <div class="photo-box"><img src="images/IMG_3276.JPG" alt="Traditional Wall Painting Interior"></div>
                <div class="photo-box"><img src="images/IMG_3285.JPG" alt="San Francisco Street Night Lanterns"></div>
                <div class="photo-box"><img src="images/IMG_3303.JPG" alt="Chinatown Lanterns Red Glow"></div>
                <div class="photo-box"><img src="images/IMG_3319.JPG" alt="Bruce Lee Mural Chinatown Alley"></div>
                <div class="photo-box"><img src="images/IMG_3327.JPG" alt="Chinatown Night Street View"></div>
                <<div class="photo-box"><img src="images/IMG_3465.JPG" alt="Vibrant Jellyfish Aquarium"></div>

                <!-- Portrait Shot -->
                <div class="photo-box vertical"><img src="images/IMG_3346.JPG" alt="Quinceañera Portrait Stained Glass Vertical"></div>
            </div> <!-- This closes the grid container AFTER all images are listed -->
        </section>

        <!-- Contact Section -->
        <section id="contact" class="contact-container">
            <h2>Let's Work Together</h2>
            <p>Now booking portrait sessions, event coverage, and commercial projects.</p>
            <a href="mailto:Allzawsome100@gmail.com" class="email-button">Contact Via Email</a>

</body>
</html>
